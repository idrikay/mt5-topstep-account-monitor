version: 2

updates:
  # ── Backend (Node.js) ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # Group non-breaking production updates into a single PR to reduce noise.
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Major version bumps require manual review — they often carry breaking
      # API changes (e.g. metaapi.cloud-sdk, socket.io).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Frontend (Angular / Node.js) ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      angular-packages:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - minor
          - patch
      other-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
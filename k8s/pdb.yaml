apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-dashboard-pdb
  namespace: apps
spec:
  # maxUnavailable: 1 allows the single pod to be evicted during node
  # maintenance or cluster upgrades without blocking the drain operation.
  #
  # If you scale to 2+ replicas in the future, switch to:
  #   minAvailable: 1
  # to guarantee at least one pod is always serving traffic during disruptions.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: trading-dashboard
# secret.template.yaml
#
# This file documents the shape of the trading-dashboard-credentials Secret.
# It is intentionally committed with empty values — the live Secret is created
# and rotated by the GitHub Actions deploy workflow using values stored in
# GitHub Actions secrets, and is never written to disk or version control.
#
# To create the secret manually for local cluster testing:
#
#   kubectl create secret generic trading-dashboard-credentials \
#     --namespace apps \
#     --from-literal=METAAPI_TOKEN=<token> \
#     --from-literal=MT5_1_ACCOUNT_ID=<id> \
#     --from-literal=TOPSTEP_1_USERNAME=<username> \
#     --from-literal=TOPSTEP_1_API_KEY=<key>
#
apiVersion: v1
kind: Secret
metadata:
  name: trading-dashboard-credentials
  namespace: apps
type: Opaque
stringData:
  # MetaApi
  METAAPI_TOKEN:      ""

  # MT5 account IDs (add MT5_2_ACCOUNT_ID etc. for additional accounts)
  MT5_1_ACCOUNT_ID:   ""

  # TopStepX credentials (add TOPSTEP_2_* etc. for additional accounts)
  TOPSTEP_1_USERNAME: ""
  TOPSTEP_1_API_KEY:  ""